services:
  db:
    image: postgres:18
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql
    networks:
      - notes-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:8.2
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - notes-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: daulyoi/backend
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - notes-network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: daulyoi/frontend
    ports:
      # Publish on all interfaces so the UI is reachable on EC2 (not only localhost)
      - "8080:80"
    depends_on:
      - backend
    networks:
      - notes-network
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    image: daulyoi/worker
    depends_on:
      - backend
    networks:
      - notes-network

volumes:
  postgres-data:
    driver: local

networks:
  notes-network:
    driver: bridge
