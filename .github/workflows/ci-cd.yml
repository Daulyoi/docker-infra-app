name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, worker]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, worker]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    permissions:
      contents: read
      id-token: write

    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend, worker]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to EC2 via AWS SSM
        shell: bash
        run: |
          set -euo pipefail

          secrets=$(aws secretsmanager get-secret-value \
            --secret-id docker-infra-app/env \
            --query SecretString \
            --output text \
            --region us-east-1)

          # Encode the secret so it can safely be embedded in the remote command.
          secret_b64=$(printf '%s' "$secrets" | base64 | tr -d '\n')

          write_env_cmd=$(cat <<EOF
          printf '%s' '$secret_b64' |
            base64 -d |
            jq -r 'to_entries | .[] | "\(.key)=\(.value)"' \
            > /home/ec2-user/.env
          EOF
          )

          parameters=$(jq -cn \
            --arg write_env_cmd "$write_env_cmd" \
            '{
              commands: [
                "set -eu",
                $write_env_cmd,
                "sudo -u ec2-user -H docker compose -f /home/ec2-user/docker-compose.yaml pull",
                "sudo -u ec2-user -H docker compose -f /home/ec2-user/docker-compose.yaml up -d --remove-orphans"
              ]
            }')

          command_id=$(aws ssm send-command \
            --instance-ids "${{ vars.AWS_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploying latest Docker containers via GitHub Actions" \
            --parameters "$parameters" \
            --region us-east-1 \
            --query "Command.CommandId" \
            --output text)

          if ! aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "${{ vars.AWS_INSTANCE_ID }}" \
            --region us-east-1; then
            echo "SSM command failed: $command_id"

            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "${{ vars.AWS_INSTANCE_ID }}" \
              --region us-east-1 \
              --query '{Status:Status,StatusDetails:StatusDetails,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
              --output json

            exit 1
          fi
