name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, worker]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, worker]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    permissions:
      contents: read
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    # REQUIRED FOR OIDC AUTHENTICATION
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Deploy to EC2 via AWS SSM
        shell: bash
        run: |
          set -euo pipefail

          # Fetch secrets from AWS Secrets Manager
          secrets=$(aws secretsmanager get-secret-value \
            --secret-id docker-infra-app/env \
            --query SecretString \
            --output text \
            --region us-east-1)

          # Generate .env file on the EC2 instance
          command_id=$(aws ssm send-command \
            --instance-ids "${{ vars.AWS_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploying latest Docker containers via GitHub Actions" \
            --parameters 'commands=[
              "set -eu",
              "echo '"$secrets"' | jq -r '"'"'to_entries | .[] | \"\\(.key)=\\(.value)\"'"'"' > /home/ec2-user/.env",
              "sudo -u ec2-user -H docker compose -f /home/ec2-user/docker-compose.yaml pull",
              "sudo -u ec2-user -H docker compose -f /home/ec2-user/docker-compose.yaml up -d --remove-orphans"
            ]' \
            --region us-east-1 \
            --query "Command.CommandId" \
            --output text)

          if ! aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "${{ vars.AWS_INSTANCE_ID }}" \
            --region us-east-1; then
            echo "SSM command failed: $command_id"

            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "${{ vars.AWS_INSTANCE_ID }}" \
              --region us-east-1 \
              --query '{Status:Status,StatusDetails:StatusDetails,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
              --output json

            exit 1
          fi
